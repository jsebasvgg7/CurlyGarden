# Habilita el uso de librerias AndroidX (requerido por Compose y Firebase modernos)
android.useAndroidX=true
android.enableJetifier=false

# Kotlin genera codigo mas eficiente usando esta bandera
kotlin.code.style=official

# Memoria disponible para el proceso de build de Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Habilita la cache de configuracion y el daemon para builds mas rapidos
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
